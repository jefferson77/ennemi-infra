---
# The development and deploy machine: it runs the playbooks itself, so there is
# nothing to reach over the network and no login account to configure.

# nginx: this host is the edge for ennemi.net. Public DNS for the domain points
# at this site's address and the router forwards 80 and 443 here, but the web
# server itself runs on ennemi-brain, so both ports are forwarded to it over
# the tailnet.
#
# The two halves work differently and that is deliberate, see the header of
# each file: port 80 is proxied at the HTTP layer, port 443 is passed through
# untouched at the TCP layer so ennemi-brain keeps serving its own letsencrypt
# certificate and this machine needs no key of its own for those names.
nginx_sites:
  - ennemi.net-edge

nginx_stream_sites:
  - ennemi.net-tls

# dev.ennemi.net: the webapp's development server, for the tailnet only. Public
# DNS answers the name with this host's tailscale IP; the stream config above
# hands the connections made to that address to this site, which terminates TLS
# with a certificate of this host's own -- so the site waits for it. See the
# header of each file.
nginx_tls_sites:
  - name: dev.ennemi.net
    certificate: /etc/letsencrypt/live/dev.ennemi.net/fullchain.pem

# certbot: that certificate, over DNS-01 through OVH's API -- the name resolves
# to a tailscale address, which Let's Encrypt cannot reach to validate it over
# HTTP. The API credentials are the OVH_* keys of .env.
certbot_email: nico@data4green.com

certbot_certificates:
  - name: dev.ennemi.net
    method: dns-ovh
    domains:
      - dev.ennemi.net
