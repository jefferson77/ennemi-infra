---
# Login account on the physical production machine. The key, port and ssh
# options are shared with the other production host and live in
# group_vars/prod.yml.
ansible_user: ennemi

# nginx: the sites this host already serves, copied into the repo as they were
# found on disk -- ennemi.net since repointed at /var/www/webapp, where the
# webapp's `make deploy` now puts the build (roles/ennemi_webapp). The
# certificate it references stays on the host (letsencrypt) and is not managed
# here. dev.ennemi.net, the staging site, was retired with its service on
# 2026-09-29: the webapp is now developed on ennemi-dev. ennemi.net also
# answers on internal.ennemi.net, a LAN-only name for development; the
# letsencrypt lineage www.ennemi.net was expanded by hand to include it.
nginx_sites:
  - ennemi.net

nginx_conf_d:
  - stub_status.conf

# The ennemi.net site serves the webapp's pre-compressed build with
# brotli_static, a fatal `nginx -t` error without the brotli modules. They were
# installed by hand here; listing them keeps a rebuilt host startable.
nginx_brotli: true

# DNS: no AdGuard Home here, so the systemd-resolved stub owns port 53 and
# tailscale_accept_dns keeps its default. tailscaled then installs the tailnet
# suffix as split DNS on tailscale0, which is how the webapp reaches
# ennemi-vps.tail21508.ts.net (roles/ennemi_webapp); the LAN router still
# answers everything else.
