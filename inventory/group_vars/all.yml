---
# Applies to every host in the project.
ennemi_project: ennemi

# Credentials live in .env at the root of the checkout, which is git-ignored;
# .env.example is the committed template. Nothing secret belongs in this
# repository, so every value below is read from that file rather than written
# here.
#
# The path is derived from the inventory rather than the working directory, so
# a run works the same from anywhere. `errors: ignore` makes a missing file or
# key an empty value instead of a crash — the roles assert on the empty value
# and say what to do about it, which is a far better error than a traceback.
#
# The file is read directly, not through the shell, so `./deploy` and a bare
# `ansible-playbook` behave identically and nothing has to be exported first.
ennemi_env_file: "{{ inventory_dir | dirname }}/.env"

postgres_app_password: >-
  {{ lookup('ansible.builtin.ini', 'POSTGRES_APP_PASSWORD',
            type='properties', file=ennemi_env_file, errors='ignore')
     | default('', true) }}

# Personal access token gh logs in with on every host (roles/common), so the
# ennemi account can reach the private GitHub repositories. Optional: left out
# of .env, gh is still installed and the login stays a manual `gh auth login`.
common_gh_token: >-
  {{ lookup('ansible.builtin.ini', 'GITHUB_TOKEN',
            type='properties', file=ennemi_env_file, errors='ignore')
     | default('', true) }}

# Seals the show app's Control login cookie (roles/ennemi_webapp). Required
# there: the role refuses to run without one of at least 32 characters.
ennemi_webapp_session_password: >-
  {{ lookup('ansible.builtin.ini', 'WEBAPP_SESSION_PASSWORD',
            type='properties', file=ennemi_env_file, errors='ignore')
     | default('', true) }}

# ennemi-web's SHOW_TOKEN, a copy of the one in that repository's own .env. The
# show app on ennemi-brain sends it to switch www.ennemi.net (roles/ennemi_webapp).
# Optional: left out of .env, Play and Stop leave the site alone.
ennemi_web_show_token: >-
  {{ lookup('ansible.builtin.ini', 'SHOW_TOKEN',
            type='properties', file=ennemi_env_file, errors='ignore')
     | default('', true) }}
