---
# Transport for the production hosts. Only these are reached over the network;
# the dev host runs the playbooks on itself with a local connection.
#
# Every production host is reached with this one key; only the login account
# differs, and that is set per host in host_vars/.
#
# The key is named explicitly so a run does not depend on ~/.ssh/config or on
# ssh-agent holding the right identity.
ansible_ssh_private_key_file: ~/.ssh/id_rsa

ansible_port: 22

# Offer only the key above: without this, ssh walks its default identity list
# and can exhaust MaxAuthTries before reaching it.
ansible_ssh_common_args: -o IdentitiesOnly=yes
