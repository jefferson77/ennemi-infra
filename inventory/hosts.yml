---
# Single inventory for the "ennemi" project.
#
#   metal : this physical machine (managed locally, no SSH)
#   vps   : the external VPS (managed over SSH)
#   dev   : the development box (managed over SSH)
#
# Every host reached over SSH is addressed by its tailscale IP. Those addresses
# are stable per node and reachable from anywhere on the tailnet, unlike the LAN
# address of the dev box or the public name of the VPS. The trade-off is that a
# deploy now requires this controller to be on the tailnet.
#
# The addresses are the ones in `tailscale status`; the MagicDNS name of each is
# in the comment beside it. The literal IP is used rather than the name so a
# deploy does not also depend on DNS working.
all:

  # Ungrouped on purpose: naming a group "dev" as well as the host would make
  # ansible warn about the collision. Its variables live in host_vars/dev.yml.
  hosts:
    dev:
      ansible_host: 100.70.200.32   # ennemi-dev.tail21508.ts.net

  children:

    metal:
      hosts:
        ennemi-brain:
          ansible_connection: local

    vps:
      hosts:
        ennemi-vps:
          ansible_host: 100.94.0.56   # ennemi-vps.tail21508.ts.net
