---
# Single inventory for the "ennemi" project.
#
#   dev  : this machine — development and deploy controller (managed locally)
#   prod : the two production hosts, reached over SSH
#
# The controller manages itself with `ansible_connection: local`, so no SSH key
# or login account is involved for the dev host and a deploy of it works even
# with the tailnet down.
#
# Every production host is addressed by its tailscale IP. Those addresses are
# stable per node and reachable from anywhere on the tailnet, unlike a LAN
# address or a public name. The trade-off is that a production deploy requires
# this controller to be on the tailnet.
#
# The addresses are the ones in `tailscale status`; the MagicDNS name of each is
# in the comment beside it. The literal IP is used rather than the name so a
# deploy does not also depend on DNS working.
all:
  children:

    dev:
      hosts:
        ennemi-dev:
          ansible_connection: local

    prod:
      hosts:
        ennemi-brain:
          ansible_host: 100.86.27.113   # ennemi.tail21508.ts.net
        ennemi-vps:
          ansible_host: 100.94.0.56     # ennemi-vps.tail21508.ts.net

    # Hosts running the Dragonfly cache: ennemi-brain serves production and
    # ennemi-dev mirrors it, same service and same settings. A group of its
    # own, so the dragonfly role never has to know which host it is on and the
    # play that applies it reads like the others. A host belongs to as many
    # groups as it needs, so ennemi-brain is both "prod" and "cache".
    cache:
      hosts:
        ennemi-brain:
        ennemi-dev:

    # Hosts running a PostgreSQL cluster: ennemi-brain serves production,
    # ennemi-dev is the development database on the controller itself. The VPS
    # has no database of its own.
    database:
      hosts:
        ennemi-brain:
        ennemi-dev:
