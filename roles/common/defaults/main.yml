---
# Skip the cache refresh if apt already updated less than an hour ago.
common_apt_cache_valid_time: 3600

# Passed straight to the apt module after the dist-upgrade.
common_apt_autoremove: true
common_apt_autoclean: true

# Baseline toolset installed on every host. Add to this list rather than
# installing by hand, so a rebuilt host comes back with the same tools.
common_packages:
  - git
  - htop
  - vim
  - curl
  - gh      # GitHub CLI, so every host can reach the private repositories

# Personal access token gh logs in with, for the {{ common_user }} account.
# Deliberately empty here: the real value is GITHUB_TOKEN in the git-ignored
# .env, read by inventory/group_vars/all.yml. Left empty, gh is still
# installed and the login stays a manual `gh auth login` on the host.
common_gh_token: ""

# Run `gh auth setup-git`, so plain git over HTTPS (clone, fetch, push) uses
# the same token as gh itself instead of prompting. Only reached when a token
# is set.
common_gh_setup_git: true

# The admin account every host must have. On ennemi-brain and ennemi-dev it
# already exists (uid 1000) and these settings match it, so the tasks are a
# no-op there.
common_user: ennemi
common_user_shell: /bin/bash

# Groups the account is *added* to; existing group memberships are kept.
common_user_groups: [sudo]

# Public half of the key used to reach the production hosts. Read from the
# controller at run time, so rotating the key on this machine is enough.
common_user_public_key_file: ~/.ssh/id_rsa.pub

# A NOPASSWD rule in /etc/sudoers.d/ennemi. Set to false to drop the rule and
# fall back to the plain sudo-group membership (which prompts for a password).
common_user_passwordless_sudo: true
