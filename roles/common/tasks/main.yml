---
- name: Fail early on a non-apt distribution
  ansible.builtin.assert:
    that: ansible_facts['pkg_mgr'] in ['apt', 'apt_rpm']
    fail_msg: >-
      The common role only manages apt-based hosts, but
      {{ inventory_hostname }} reports pkg_mgr={{ ansible_facts['pkg_mgr'] }}.
    quiet: true

- name: Create the user account {{ common_user }}
  ansible.builtin.user:
    name: "{{ common_user }}"
    shell: "{{ common_user_shell }}"
    groups: "{{ common_user_groups }}"
    append: true
    create_home: true
    state: present
  become: true
  tags: [user]

# exclusive: false so any key already trusted by the account survives.
- name: Authorise the SSH key for {{ common_user }}
  ansible.posix.authorized_key:
    user: "{{ common_user }}"
    key: "{{ lookup('ansible.builtin.file', common_user_public_key_file | expanduser) }}"
    exclusive: false
    state: present
  become: true
  tags: [user]

- name: Grant passwordless sudo to {{ common_user }}
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/{{ common_user }}"
    content: "{{ common_user }} ALL=(ALL) NOPASSWD:ALL\n"
    owner: root
    group: root
    mode: "0440"
    validate: visudo -cf %s
  become: true
  when: common_user_passwordless_sudo | bool
  tags: [user]

- name: Drop the passwordless sudo rule when it is turned off
  ansible.builtin.file:
    path: "/etc/sudoers.d/{{ common_user }}"
    state: absent
  become: true
  when: not common_user_passwordless_sudo | bool
  tags: [user]

- name: Update the apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: "{{ common_apt_cache_valid_time }}"
  become: true
  register: common_apt_cache_result
  until: common_apt_cache_result is succeeded
  retries: 3
  delay: 10
  tags: [packages]

- name: Upgrade all packages (dist-upgrade)
  ansible.builtin.apt:
    upgrade: dist
    autoremove: "{{ common_apt_autoremove | bool }}"
    autoclean: "{{ common_apt_autoclean | bool }}"
  become: true
  environment:
    DEBIAN_FRONTEND: noninteractive
  tags: [packages]

# Also tagged gh, so `--tags gh` installs the CLI before the login tasks below
# reach for it on a host that has never had a full run.
- name: Install the baseline packages
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present
  become: true
  environment:
    DEBIAN_FRONTEND: noninteractive
  tags: [packages, gh]

# ---------------------------------------------------------------- GitHub CLI
# gh itself is installed by the baseline task above, from the Ubuntu archive
# (all three hosts run 26.04, which ships it) — no third-party repository for
# a single package. What is left here is the login, tagged `gh` as well as
# `packages` so a token can be rotated without running the dist-upgrade.

# The token gh already holds, so the login below runs on a fresh host and on a
# rotated token, and is skipped on every other run. Non-zero rc and empty
# output both mean "no token", which the comparison handles on its own.
- name: Read the GitHub token already held by {{ common_user }}
  ansible.builtin.command: gh auth token --hostname github.com
  become: true
  become_user: "{{ common_user }}"
  register: common_gh_current_token
  changed_when: false
  failed_when: false
  check_mode: false
  no_log: true
  tags: [packages, gh]

- name: Log in to GitHub as {{ common_user }}
  ansible.builtin.command:
    cmd: gh auth login --hostname github.com --with-token
    stdin: "{{ common_gh_token }}"
  become: true
  become_user: "{{ common_user }}"
  when:
    - common_gh_token | length > 0
    - common_gh_token != common_gh_current_token.stdout | default('') | trim
  changed_when: true
  no_log: true
  tags: [packages, gh]

# Writes a credential.helper for github.com into the account's ~/.gitconfig.
# Idempotent and silent, so it is reported as ok rather than changed.
- name: Let plain git use gh's credentials
  ansible.builtin.command: gh auth setup-git --hostname github.com
  become: true
  become_user: "{{ common_user }}"
  when:
    - common_gh_token | length > 0
    - common_gh_setup_git | bool
  changed_when: false
  tags: [packages, gh]

# check_mode: false so a --check run reports the version actually on the host
# rather than a skip; failed_when: false so it says so plainly when --check
# reaches a host the baseline install has not really run on yet.
- name: Read the installed gh version
  ansible.builtin.command: gh --version
  changed_when: false
  failed_when: false
  check_mode: false
  register: common_gh_version
  tags: [packages, gh]

- name: Report the GitHub CLI state
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }}:
      {{ common_gh_version.stdout_lines | first | default('gh not installed', true) }},
      {{ common_user }}
      {{ 'authenticated with GITHUB_TOKEN from .env'
         if common_gh_token | length > 0
         else 'not logged in — run `gh auth login` on the host, or set GITHUB_TOKEN in .env' }}
  tags: [packages, gh]

- name: Check whether the upgrade requires a reboot
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: common_reboot_required
  tags: [packages]

- name: Read the packages that asked for the reboot
  ansible.builtin.slurp:
    src: /var/run/reboot-required.pkgs
  register: common_reboot_pkgs
  when: common_reboot_required.stat.exists
  failed_when: false
  tags: [packages]

- name: Record the reboot state for the end-of-run summary
  ansible.builtin.set_fact:
    common_reboot_needed: "{{ common_reboot_required.stat.exists }}"
    common_reboot_packages: >-
      {{ (common_reboot_pkgs.content | default('') | b64decode).split()
         | unique | sort | list }}
  tags: [packages]

# This role never reboots anything: a reboot cuts the SSH session it was
# ordered from, and on ennemi-dev it would kill the controller running the
# playbook. The hosts are listed here instead, to be rebooted by hand.
- name: List the hosts that need a manual reboot
  ansible.builtin.debug:
    msg: >-
      {{ item }} needs a reboot
      ({{ hostvars[item].common_reboot_packages | default([]) | join(', ')
          | default('no package list', true) }})
  loop: "{{ ansible_play_hosts }}"
  loop_control:
    label: "{{ item }}"
  when: hostvars[item].common_reboot_needed | default(false)
  run_once: true
  tags: [packages]

- name: Report that no host needs a reboot
  ansible.builtin.debug:
    msg: No host needs a reboot.
  when: >-
    ansible_play_hosts | map('extract', hostvars, 'common_reboot_needed')
    | map('default', false) | select | list | length == 0
  run_once: true
  tags: [packages]
