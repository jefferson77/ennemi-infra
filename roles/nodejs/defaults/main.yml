---
# Node.js, from NodeSource's apt repository.
#
# Ubuntu's own nodejs package follows the distribution's schedule, not Node's:
# its major version is whatever was current when the release froze. NodeSource
# publishes one repository per major line instead, so the host gets the major
# asked for here and every security release of it through apt -- which
# roles/common's dist-upgrade then keeps current, like any other package.
#
# Keep this on the major in ennemi-web's .nvmrc: that project's server/ is what
# runs on it.
nodejs_major: 24

nodejs_apt_key_url: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
nodejs_apt_keyring: /etc/apt/keyrings/nodesource.asc
nodejs_apt_uri: "https://deb.nodesource.com/node_{{ nodejs_major }}.x"

# Priority of the NodeSource origin over Ubuntu's. Above 500 so apt prefers
# NodeSource's nodejs even when the archive carries a higher-numbered one;
# below 1000 so it never downgrades anything on its own.
nodejs_apt_pin_priority: 600
