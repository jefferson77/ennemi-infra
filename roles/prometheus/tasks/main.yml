---
# Describes the Prometheus installation that already exists on ennemi-brain
# and reproduces it elsewhere, the way roles/dragonfly does: on a host that
# already matches, every task below is a no-op except the config file, which
# this role renders from variables rather than copying the hand-written one.

- name: Resolve the latest Prometheus release
  ansible.builtin.uri:
    url: "{{ prometheus_releases_url }}/latest"
    method: GET
    follow_redirects: none
    status_code: [301, 302]
  register: prometheus_latest_release
  delegate_to: localhost
  run_once: true
  check_mode: false   # read-only, must run so --check knows what it compares to
  when: prometheus_version | length == 0

- name: Record the version to install
  ansible.builtin.set_fact:
    prometheus_target_version: >-
      {{ prometheus_version if prometheus_version | length > 0
         else prometheus_latest_release.location | basename | regex_replace('^v', '') }}

- name: Create the service group
  ansible.builtin.group:
    name: "{{ prometheus_group }}"
    system: true
    state: present
  become: true

- name: Create the service account
  ansible.builtin.user:
    name: "{{ prometheus_user }}"
    group: "{{ prometheus_group }}"
    system: true
    shell: /usr/sbin/nologin
    home: "{{ prometheus_data_dir | dirname }}"
    create_home: false
    state: present
  become: true

- name: Look for an installed Prometheus
  ansible.builtin.stat:
    path: "{{ prometheus_binary }}"
  register: prometheus_binary_stat
  become: true

# `prometheus --version` prints "prometheus, version 3.1.0 (branch: ...)".
- name: Read the installed version
  ansible.builtin.command: "{{ prometheus_binary }} --version"
  register: prometheus_version_output
  changed_when: false
  check_mode: false   # read-only, must run so --check knows what it compares to
  when: prometheus_binary_stat.stat.exists
  become: true

- name: Record the installed version
  ansible.builtin.set_fact:
    prometheus_installed_version: >-
      {{ ((prometheus_version_output.stdout | default('')) ~ (prometheus_version_output.stderr | default('')))
         | regex_search('version ([0-9]+\.[0-9]+\.[0-9]+)', '\1') | default([''], true) | first }}

- name: Report the Prometheus install this run would perform
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }}: would install Prometheus {{ prometheus_target_version }}
      (currently {{ prometheus_installed_version | default('', true) | ternary(prometheus_installed_version, 'not installed') }}).
  when:
    - ansible_check_mode
    - prometheus_installed_version != prometheus_target_version

- name: Install Prometheus {{ prometheus_target_version }}
  when:
    - prometheus_installed_version != prometheus_target_version
    - not ansible_check_mode
  become: true
  block:
    - name: Create the installation directory
      ansible.builtin.file:
        path: "{{ prometheus_install_dir }}"
        state: directory
        owner: "{{ prometheus_user }}"
        group: "{{ prometheus_group }}"
        mode: "0755"

    - name: Create a staging directory for the release
      ansible.builtin.file:
        path: "{{ prometheus_staging_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Download the release tarball
      ansible.builtin.get_url:
        url: "{{ prometheus_releases_url }}/download/v{{ prometheus_target_version }}/prometheus-{{ prometheus_target_version }}.{{ prometheus_arch }}.tar.gz"
        dest: "{{ prometheus_staging_dir }}/prometheus.tar.gz"
        owner: root
        group: root
        mode: "0600"

    - name: Unpack it
      ansible.builtin.unarchive:
        src: "{{ prometheus_staging_dir }}/prometheus.tar.gz"
        dest: "{{ prometheus_staging_dir }}"
        remote_src: true

    - name: Check that the new binary runs on this host
      ansible.builtin.command: "{{ prometheus_staging_dir }}/prometheus-{{ prometheus_target_version }}.{{ prometheus_arch }}/prometheus --version"
      changed_when: false

    - name: Install the binaries
      ansible.builtin.copy:
        src: "{{ prometheus_staging_dir }}/prometheus-{{ prometheus_target_version }}.{{ prometheus_arch }}/{{ item }}"
        dest: "{{ prometheus_install_dir }}/{{ item }}"
        remote_src: true
        owner: "{{ prometheus_user }}"
        group: "{{ prometheus_group }}"
        mode: "0755"
      loop:
        - prometheus
        - promtool
      notify: Restart Prometheus

    - name: Remove the staging directory
      ansible.builtin.file:
        path: "{{ prometheus_staging_dir }}"
        state: absent

- name: Create the configuration and data directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ prometheus_group }}"
    mode: "0755"
  become: true
  loop:
    - {path: "{{ prometheus_config_dir }}", owner: root}
    - {path: "{{ prometheus_data_dir | dirname }}", owner: "{{ prometheus_user }}"}
    - {path: "{{ prometheus_data_dir }}", owner: "{{ prometheus_user }}"}
  loop_control:
    label: "{{ item.path }}"

# Validated with promtool before it lands, so a bad scrape job fails the play
# instead of being reloaded into a running server. On a host without
# Prometheus yet (--check on a fresh host) there is no promtool to validate
# with, and the template is written unvalidated.
- name: Deploy the configuration
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: "{{ prometheus_config_file }}"
    owner: root
    group: "{{ prometheus_group }}"
    mode: "0644"
    validate: "{{ (prometheus_promtool ~ ' check config %s') if prometheus_binary_stat.stat.exists else omit }}"
    backup: true
  become: true
  notify: Reload Prometheus

# Deliberately carries no "managed by ansible" header: the template renders
# byte for byte what ennemi-brain already has, plus an ExecReload line so a
# scrape-config change is a reload rather than a restart with a gap.
- name: Deploy the service unit
  ansible.builtin.template:
    src: prometheus.service.j2
    dest: "{{ prometheus_unit_file }}"
    owner: root
    group: root
    mode: "0644"
    backup: true
  become: true
  notify: Restart Prometheus

- name: Enable and start Prometheus
  ansible.builtin.systemd_service:
    name: "{{ prometheus_service }}"
    enabled: "{{ prometheus_service_enabled | bool }}"
    state: "{{ prometheus_service_state }}"
    daemon_reload: true
  become: true

- name: Apply any pending reload or restart
  ansible.builtin.meta: flush_handlers

- name: Check that Prometheus is ready
  ansible.builtin.uri:
    url: "http://{{ prometheus_listen_address }}{{ prometheus_route_prefix }}/-/ready"
  register: prometheus_ready
  until: prometheus_ready.status == 200
  retries: 10
  delay: 3
  when: not ansible_check_mode

- name: Report the running Prometheus
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }}: Prometheus
      {{ prometheus_installed_version | default('', true) | ternary(prometheus_installed_version, prometheus_target_version) }}
      ready on {{ prometheus_listen_address }}{{ prometheus_route_prefix }},
      {{ (prometheus_scrape_configs + prometheus_extra_scrape_configs) | length }} scrape jobs.
  when: prometheus_ready is not skipped
