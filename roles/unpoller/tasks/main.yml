---
- name: Fail early without a way into the console
  ansible.builtin.assert:
    that: >-
      unpoller_unifi_api_key | length > 0
      or (unpoller_unifi_user | length > 0 and unpoller_unifi_password | length > 0)
    fail_msg: >-
      Neither UNPOLLER_API_KEY nor UNPOLLER_USER / UNPOLLER_PASSWORD is set in
      .env. unpoller reaches the UniFi console with an API key made there
      (Settings -> Control Plane -> Integrations), or with a local account:
      put one of the two in .env and run again.
    quiet: true

- name: Resolve the latest unpoller release
  ansible.builtin.uri:
    url: "{{ unpoller_releases_url }}/latest"
    method: GET
    follow_redirects: none
    status_code: [301, 302]
  register: unpoller_latest_release
  delegate_to: localhost
  run_once: true
  check_mode: false   # read-only, must run so --check knows what it compares to
  when: unpoller_version | length == 0

- name: Record the version to install
  ansible.builtin.set_fact:
    unpoller_target_version: >-
      {{ unpoller_version if unpoller_version | length > 0
         else unpoller_latest_release.location | basename | regex_replace('^v', '') }}

- name: Create the service group
  ansible.builtin.group:
    name: "{{ unpoller_group }}"
    system: true
    state: present
  become: true

- name: Create the service account
  ansible.builtin.user:
    name: "{{ unpoller_user }}"
    group: "{{ unpoller_group }}"
    system: true
    shell: /usr/sbin/nologin
    home: "{{ unpoller_install_dir }}"
    create_home: false
    state: present
  become: true

- name: Look for an installed unpoller
  ansible.builtin.stat:
    path: "{{ unpoller_binary }}"
  register: unpoller_binary_stat
  become: true

# `unpoller -v` prints "unpoller, version 5.9.4 (branch: ...)", on stdout or stderr.
- name: Read the installed version
  ansible.builtin.command: "{{ unpoller_binary }} -v"
  register: unpoller_version_output
  changed_when: false
  check_mode: false   # read-only, must run so --check knows what it compares to
  when: unpoller_binary_stat.stat.exists
  become: true

- name: Record the installed version
  ansible.builtin.set_fact:
    unpoller_installed_version: >-
      {{ ((unpoller_version_output.stdout | default('')) ~ (unpoller_version_output.stderr | default('')))
         | regex_search('version v?([0-9]+\.[0-9]+\.[0-9]+)', '\1') | default([''], true) | first }}

- name: Report the unpoller install this run would perform
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }}: would install unpoller {{ unpoller_target_version }}
      (currently {{ unpoller_installed_version | default('', true) | ternary(unpoller_installed_version, 'not installed') }}).
  when:
    - ansible_check_mode
    - unpoller_installed_version != unpoller_target_version

- name: Install unpoller {{ unpoller_target_version }}
  when:
    - unpoller_installed_version != unpoller_target_version
    - not ansible_check_mode
  become: true
  block:
    - name: Create the installation directory
      ansible.builtin.file:
        path: "{{ unpoller_install_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Create a staging directory for the release
      ansible.builtin.file:
        path: "{{ unpoller_staging_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Download the release tarball
      ansible.builtin.get_url:
        url: "{{ unpoller_releases_url }}/download/v{{ unpoller_target_version }}/unpoller_{{ unpoller_target_version }}_{{ unpoller_arch }}.tar.gz"
        dest: "{{ unpoller_staging_dir }}/unpoller.tar.gz"
        owner: root
        group: root
        mode: "0600"

    - name: Unpack it
      ansible.builtin.unarchive:
        src: "{{ unpoller_staging_dir }}/unpoller.tar.gz"
        dest: "{{ unpoller_staging_dir }}"
        remote_src: true

    - name: Check that the new binary runs on this host
      ansible.builtin.command: "{{ unpoller_staging_dir }}/unpoller -v"
      changed_when: false

    - name: Install the binary
      ansible.builtin.copy:
        src: "{{ unpoller_staging_dir }}/unpoller"
        dest: "{{ unpoller_binary }}"
        remote_src: true
        owner: root
        group: root
        mode: "0755"
      notify: Restart unpoller

    - name: Install the licence beside it
      ansible.builtin.copy:
        src: "{{ unpoller_staging_dir }}/LICENSE"
        dest: "{{ unpoller_install_dir }}/LICENSE"
        remote_src: true
        owner: root
        group: root
        mode: "0644"

    - name: Remove the staging directory
      ansible.builtin.file:
        path: "{{ unpoller_staging_dir }}"
        state: absent

- name: Create the configuration directory
  ansible.builtin.file:
    path: "{{ unpoller_config_dir }}"
    state: directory
    owner: root
    group: "{{ unpoller_group }}"
    mode: "0750"
  become: true

# no_log: the rendered file holds the console password, and --diff would
# print it.
- name: Deploy the configuration
  ansible.builtin.template:
    src: up.conf.j2
    dest: "{{ unpoller_config_file }}"
    owner: root
    group: "{{ unpoller_group }}"
    mode: "0640"
  become: true
  no_log: true
  notify: Restart unpoller

- name: Deploy the service unit
  ansible.builtin.template:
    src: unpoller.service.j2
    dest: "{{ unpoller_unit_file }}"
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Restart unpoller

- name: Enable and start unpoller
  ansible.builtin.systemd_service:
    name: "{{ unpoller_service }}"
    enabled: true
    state: started
    daemon_reload: true
  become: true

- name: Apply any pending restart
  ansible.builtin.meta: flush_handlers

# A scrape is a poll of the console: the check proves the login works and
# that the site's devices come back, not only that the port is open.
- name: Check that unpoller reaches the console
  ansible.builtin.uri:
    url: "http://{{ unpoller_prometheus_listen }}/metrics"
    return_content: true
    timeout: 90
  register: unpoller_check
  until: unpoller_check.status == 200 and 'unpoller_device_info' in unpoller_check.content
  retries: 5
  delay: 5
  when: not ansible_check_mode

- name: Report the running unpoller
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }}: unpoller
      {{ unpoller_installed_version | default('', true) | ternary(unpoller_installed_version, unpoller_target_version) }}
      on {{ unpoller_prometheus_listen }}, polling {{ unpoller_unifi_url }}
      {{ 'with an API key' if unpoller_unifi_api_key | length > 0 else 'as ' ~ unpoller_unifi_user }}:
      {{ unpoller_check.content | regex_findall('unpoller_device_info\{') | length }} devices.
  when: unpoller_check is not skipped
