---
# ennemi-webapp: the show app (User phones, Control desk, Stage display) on
# ennemi-brain, behind the ennemi.net nginx site.
#
# The split with the webapp project mirrors ennemi-web's:
#
#   here     the directory, the unit, Node
#   webapp   everything inside the directory -- its `make deploy` builds on
#            ennemi-dev, rsyncs the build and the show content in, then
#            restarts the unit
#
# Unlike ennemi-web-api, the service also *writes* inside that directory: the
# Control desk's Edit Spectacle and Asset Manager tabs save to content/,
# public/ and raw_assets/ at runtime. Hence a real account that owns the
# directory rather than a DynamicUser, and the webapp deploy's guard against
# overwriting edits made in production.

ennemi_webapp_service: ennemi-webapp
ennemi_webapp_unit_file: "/etc/systemd/system/{{ ennemi_webapp_service }}.service"

# Must match WEBAPP_PATH in the webapp's scripts/deploy.sh, and the aliases in
# roles/nginx/files/sites/ennemi.net.
ennemi_webapp_dir: /var/www/webapp
ennemi_webapp_entry: "{{ ennemi_webapp_dir }}/.output/server/index.mjs"

# The directories the server resolves against its working directory and writes
# to at runtime. Created here so ReadWritePaths= in the unit names paths that
# exist -- systemd refuses to start the service otherwise.
ennemi_webapp_writable_dirs:
  - public
  - raw_assets

# Owns the directory and runs the service. The same account the deploy rsyncs
# as, so neither side needs sudo to write there.
ennemi_webapp_user: ennemi
ennemi_webapp_group: ennemi

# nginx proxies to it on localhost; must match proxy_pass in the ennemi.net site.
ennemi_webapp_port: 3000

# nuxt.config.ts computes networkIp from the interfaces of whichever machine
# runs `nuxt build`, which is now ennemi-dev. Overridden at runtime with the
# address of the host actually serving the show, as it was when brain built
# itself.
ennemi_webapp_network_ip: "{{ ansible_facts['default_ipv4']['address'] | default('') }}"

ennemi_webapp_node: /usr/bin/node

# The PostgreSQL database the app records its spectacle instances in: the
# postgres role's, on the same host. The name and user must match
# postgres_app_database / postgres_app_user in roles/postgres, which runs in
# another play, so its defaults are not visible here. The password is
# postgres_app_password, read from .env by inventory/group_vars/all.yml.
#
# Handed to the service as NUXT_DATABASE_URL in a root-only EnvironmentFile,
# not an Environment= line: the unit file itself is world-readable. Without a
# password the file carries no URL, and the app runs with instances disabled.
ennemi_webapp_env_file: "/etc/{{ ennemi_webapp_service }}.env"
ennemi_webapp_database_host: 127.0.0.1
ennemi_webapp_database_port: 5432
ennemi_webapp_database_name: ennemi
ennemi_webapp_database_user: ennemi
# Ordered before the service, so a boot starts the app after its database.
ennemi_webapp_database_unit: postgresql@18-main.service

# ennemi-web's live-state API, which Play and Stop switch so www.ennemi.net
# shows its connection tutorial only while a show runs. Reached over the
# tailnet, by the full MagicDNS name: brain moves between venue networks, and
# from brain www.ennemi.net resolves to brain itself. The ennemi-web-tailnet
# nginx site on ennemi-vps answers this name to tailnet addresses only.
#
# Handed over as NUXT_WEBSITE_LIVE_URL / NUXT_WEBSITE_SHOW_TOKEN in the same
# EnvironmentFile, and only when ennemi_web_show_token (SHOW_TOKEN in .env) is
# set: without it the app leaves the site alone.
ennemi_webapp_website_live_url: http://ennemi-vps.tail21508.ts.net/api/live
