---
# The service account is the one Prometheus runs as, created by its role; made
# here too so this role stands on its own.
- name: Create the service group
  ansible.builtin.group:
    name: "{{ exporters_group }}"
    system: true
    state: present
  become: true

- name: Create the service account
  ansible.builtin.user:
    name: "{{ exporters_user }}"
    group: "{{ exporters_group }}"
    system: true
    shell: /usr/sbin/nologin
    home: /var/lib/prometheus
    create_home: false
    state: present
  become: true

- name: Create the textfile collector directory
  ansible.builtin.file:
    path: "{{ exporters_node_textfile_dir }}"
    state: directory
    owner: root
    group: "{{ exporters_group }}"
    mode: "0775"
  become: true

- name: Install node_exporter
  ansible.builtin.include_tasks: install.yml
  vars:
    exporter:
      name: node_exporter
      version: "{{ exporters_node_version }}"
      releases_url: "{{ exporters_node_releases_url }}"
      # Tarball name and the directory inside it, as upstream publishes them.
      tarball: "node_exporter-{version}.{{ exporters_node_arch }}.tar.gz"
      unpacked_binary: "node_exporter-{version}.{{ exporters_node_arch }}/node_exporter"
      install_dir: "{{ exporters_node_install_dir }}"
      binary: "{{ exporters_node_binary }}"
      service: "{{ exporters_node_service }}"

- name: Install nginx_exporter
  ansible.builtin.include_tasks: install.yml
  vars:
    exporter:
      name: nginx_exporter
      version: "{{ exporters_nginx_version }}"
      releases_url: "{{ exporters_nginx_releases_url }}"
      tarball: "nginx-prometheus-exporter_{version}_{{ exporters_nginx_arch }}.tar.gz"
      unpacked_binary: nginx-prometheus-exporter
      install_dir: "{{ exporters_nginx_install_dir }}"
      binary: "{{ exporters_nginx_binary }}"
      service: "{{ exporters_nginx_service }}"

# Deliberately no "managed by ansible" header in either unit: each renders
# byte for byte what ennemi-brain already has (node_exporter's gains the
# textfile collector flag, which is the one change this role makes).
- name: Deploy the service units
  ansible.builtin.template:
    src: "{{ item }}.service.j2"
    dest: "/etc/systemd/system/{{ item }}.service"
    owner: root
    group: root
    mode: "0644"
    backup: true
  become: true
  loop:
    - "{{ exporters_node_service }}"
    - "{{ exporters_nginx_service }}"
  notify: Restart the exporters

- name: Enable and start the exporters
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
    daemon_reload: true
  become: true
  loop:
    - "{{ exporters_node_service }}"
    - "{{ exporters_nginx_service }}"

- name: Apply any pending restart
  ansible.builtin.meta: flush_handlers

- name: Check that each exporter answers
  ansible.builtin.uri:
    url: "http://{{ item }}/metrics"
    return_content: true
  register: exporters_check
  until: exporters_check.status == 200
  retries: 5
  delay: 2
  loop:
    - "{{ exporters_node_listen_address }}"
    - "{{ exporters_nginx_listen_address }}"
  when: not ansible_check_mode

- name: Report the exporters
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }}: node_exporter on {{ exporters_node_listen_address }},
      nginx_exporter on {{ exporters_nginx_listen_address }}, both answering.
  when: exporters_check is not skipped
