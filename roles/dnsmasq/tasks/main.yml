---
- name: Install dnsmasq and its exporter
  ansible.builtin.apt:
    name:
      - dnsmasq
      - "{{ dnsmasq_exporter_package }}"
      - dnsutils   # dig, for the check below
    state: present
  become: true
  environment:
    DEBIAN_FRONTEND: noninteractive
  register: dnsmasq_install

# The query log's directory and its rotation, as they were set up by hand on
# ennemi-brain on 2026-11-05 (hence the ownership, and no header in the
# logrotate file). dnsmasq creates the file itself, readable by its own
# account and root only; it is handed to the adm group, the way logrotate's
# `create` line below does after a rotation, which is how Alloy (in adm) reads
# it. A user ACL was tried first and did not grant the read in practice.
- name: Create the log directory
  ansible.builtin.file:
    path: "{{ dnsmasq_log_dir }}"
    state: directory
    owner: dnsmasq
    group: nogroup
    mode: "0755"
  become: true

- name: Look for the query log
  ansible.builtin.stat:
    path: "{{ dnsmasq_log_file }}"
  register: dnsmasq_log_stat
  become: true

- name: Let the adm group read the query log that is there
  ansible.builtin.file:
    path: "{{ dnsmasq_log_file }}"
    owner: dnsmasq
    group: adm
    mode: "0640"
  become: true
  when: dnsmasq_log_stat.stat.exists

- name: Rotate the query log
  ansible.builtin.copy:
    dest: /etc/logrotate.d/dnsmasq-queries
    content: |
      {{ dnsmasq_log_file }} {
          daily
          rotate {{ dnsmasq_log_rotate_days }}
          missingok
          notifempty
          compress
          delaycompress
          create 0640 dnsmasq adm
          postrotate
              /usr/bin/systemctl kill -s USR2 {{ dnsmasq_service }}.service >/dev/null 2>&1 || true
          endscript
      }
    owner: root
    group: root
    mode: "0644"
  become: true

# Deliberately no "managed by ansible" header: the template renders the file
# ennemi-brain already has, comments included, so adopting it is a no-op.
- name: Deploy the resolver configuration
  ansible.builtin.template:
    src: ennemi.conf.j2
    dest: "{{ dnsmasq_conf_file }}"
    owner: root
    group: root
    mode: "0644"
    backup: true
  become: true
  notify: Restart dnsmasq

# The fragment alone cannot be tested (`--test` on it would miss the main
# config), so the whole configuration is checked, before the handlers run: a
# bad setting fails the play while the old process still answers.
- name: Validate the whole dnsmasq configuration
  ansible.builtin.command: dnsmasq --test
  become: true
  changed_when: false
  check_mode: false

- name: Enable and start dnsmasq
  ansible.builtin.systemd_service:
    name: "{{ dnsmasq_service }}"
    enabled: true
    state: started
  become: true

# Only the exporter's arguments; the package's unit reads them from here.
- name: Configure the exporter
  ansible.builtin.copy:
    dest: "{{ dnsmasq_exporter_defaults_file }}"
    content: |
      # Managed by the ennemi infrastructure (roles/dnsmasq).
      ARGS="--dnsmasq={{ dnsmasq_listen_address }}:53 --leases_path={{ dnsmasq_exporter_leases_file }} --listen={{ dnsmasq_exporter_listen_address }}"
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Restart the dnsmasq exporter

# Existence only: the file stays empty on a host that serves no DHCP.
- name: Provide the leases file the exporter reads
  ansible.builtin.file:
    path: "{{ dnsmasq_exporter_leases_file }}"
    state: touch
    owner: root
    group: root
    mode: "0644"
    modification_time: preserve
    access_time: preserve
  become: true

# Under --check the package is not actually installed, so its unit cannot be
# enabled yet: say so instead.
- name: Enable and start the exporter
  ansible.builtin.systemd_service:
    name: "{{ dnsmasq_exporter_service }}"
    enabled: true
    state: started
  become: true
  when: not (ansible_check_mode and dnsmasq_install is changed)

- name: Say what the dry run cannot simulate
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }} would install {{ dnsmasq_exporter_package }} and
      start {{ dnsmasq_exporter_service }} on {{ dnsmasq_exporter_listen_address }}.
  when: ansible_check_mode and dnsmasq_install is changed

- name: Apply any pending restart
  ansible.builtin.meta: flush_handlers

# A real query, from this host, for the name the whole show depends on.
- name: Check that dnsmasq answers for {{ dnsmasq_local_domain }}
  ansible.builtin.command: "dig +short +time=2 +tries=1 @{{ dnsmasq_listen_address }} www.{{ dnsmasq_local_domain }}"
  register: dnsmasq_check
  changed_when: false
  until: dnsmasq_check.stdout | trim == dnsmasq_local_address
  retries: 5
  delay: 2
  when: not ansible_check_mode

- name: Check that the exporter reads dnsmasq's statistics
  ansible.builtin.uri:
    url: "http://{{ dnsmasq_exporter_listen_address }}/metrics"
    return_content: true
  register: dnsmasq_exporter_check
  until: dnsmasq_exporter_check.status == 200 and 'dnsmasq_hits' in dnsmasq_exporter_check.content
  retries: 5
  delay: 2
  when: not ansible_check_mode

- name: Report the resolver
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }}: dnsmasq on {{ dnsmasq_listen_address }} answers
      www.{{ dnsmasq_local_domain }} -> {{ dnsmasq_check.stdout | trim }}
      (query log {{ 'on' if dnsmasq_log_queries else 'off' }});
      exporter on {{ dnsmasq_exporter_listen_address }}.
  when: dnsmasq_check is not skipped
