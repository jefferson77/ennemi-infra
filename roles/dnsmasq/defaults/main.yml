---
# dnsmasq as the show network's resolver on ennemi-brain: every phone is handed
# this host as its DNS server by the gateway's DHCP, ennemi.net resolves here
# to the host itself, everything else is forwarded upstream. The settings are
# the ones found in /etc/dnsmasq.d/ennemi.conf on 2026-11-05, after the
# load-test fixes; the template renders that file byte for byte.
dnsmasq_conf_file: /etc/dnsmasq.d/ennemi.conf
dnsmasq_service: dnsmasq

dnsmasq_listen_address: 192.168.108.2
dnsmasq_local_domain: ennemi.net
dnsmasq_local_address: "{{ dnsmasq_listen_address }}"
dnsmasq_upstreams:
  - 1.1.1.1
  - 9.9.9.9
dnsmasq_all_servers: true
dnsmasq_cache_size: 10000
dnsmasq_forward_max: 2000

# A line per query (`log-queries=extra`: with the source address and the
# query's id, so an answer can be matched to its question), in a file of its
# own rather than the journal, read into Loki by roles/alloy. For the load
# tests: a full room asks hundreds of questions a second, and dnsmasq logs
# synchronously unless log-async is set, which this turns on too. Every other
# dnsmasq line goes to that file as well while this is on. Takes a restart,
# so flip it hours before doors open. Rotated daily by logrotate.
dnsmasq_log_queries: false
dnsmasq_log_dir: /var/log/dnsmasq
dnsmasq_log_file: "{{ dnsmasq_log_dir }}/queries.log"
dnsmasq_log_async: 100
dnsmasq_log_rotate_days: 14
# The account that tails the log into Loki (roles/alloy).
dnsmasq_log_reader: alloy

# The exporter reading dnsmasq's cache statistics (the CHAOS TXT records
# hits.bind, misses.bind, servers.bind, ...) over DNS, from the Ubuntu archive
# (google/dnsmasq_exporter). It also counts the leases in a dnsmasq leases
# file; this host serves no DHCP, so it reads an empty one.
dnsmasq_exporter_package: prometheus-dnsmasq-exporter
dnsmasq_exporter_service: prometheus-dnsmasq-exporter
dnsmasq_exporter_defaults_file: /etc/default/prometheus-dnsmasq-exporter
dnsmasq_exporter_listen_address: 127.0.0.1:9153
dnsmasq_exporter_leases_file: /var/lib/misc/dnsmasq.leases
