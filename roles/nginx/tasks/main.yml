---
- name: Install nginx
  ansible.builtin.apt:
    name: nginx
    state: present
  become: true
  environment:
    DEBIAN_FRONTEND: noninteractive

# The stream context is a dynamic module on Ubuntu, not part of the nginx
# package. Installing it drops a load_module line in modules-enabled/, which
# nginx.conf already includes. Only for a host that asked for a stream config:
# nothing else needs the module, and this keeps ennemi-brain untouched.
- name: Install the stream module
  ansible.builtin.apt:
    name: libnginx-mod-stream
    state: present
  become: true
  environment:
    DEBIAN_FRONTEND: noninteractive
  when: nginx_stream_sites | length > 0
  notify: Reload nginx

# Same reasoning as the stream module above: only for a host that asked, so a
# host whose sites do not mention brotli keeps an empty modules-enabled/.
- name: Install the brotli modules
  ansible.builtin.apt:
    name:
      - libnginx-mod-http-brotli-filter
      - libnginx-mod-http-brotli-static
    state: present
  become: true
  environment:
    DEBIAN_FRONTEND: noninteractive
  when: nginx_brotli | bool
  notify: Reload nginx

- name: Create the stream configuration directories
  ansible.builtin.file:
    path: "/etc/nginx/{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true
  loop:
    - streams-available
    - streams-enabled
  when: nginx_stream_sites | length > 0

# nginx.conf itself is otherwise left alone: on ennemi-brain it is
# byte-identical to the packaged conffile, so the distribution stays in charge
# of it. The one exception is this block, and only on a host with a stream
# config to serve. It has to go here because `stream` is a top-level context,
# a sibling of `http` -- there is no packaged include point for it the way
# conf.d and sites-enabled are include points inside `http`.
- name: Add the stream include to nginx.conf
  ansible.builtin.blockinfile:
    path: /etc/nginx/nginx.conf
    marker: "# {mark} ANSIBLE MANAGED BLOCK: stream"
    block: |
      stream {
          include /etc/nginx/streams-enabled/*;
      }
    validate: nginx -t -c %s
  become: true
  when: nginx_stream_sites | length > 0
  notify: Reload nginx

# Existence only: no owner, group or mode. A document root is usually written
# by whatever deploys the site -- /var/www/ennemi-web on the VPS belongs to the
# ennemi account -- and taking it over as www-data here would break exactly that
# on the next run. Ansible leaves an existing directory's ownership alone when
# none is given, and a new one is created root-owned, which nginx can read.
- name: Create the document roots  # noqa: risky-file-permissions
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
  become: true
  loop: "{{ nginx_webroots }}"

- name: Deploy the conf.d fragments
  ansible.builtin.copy:
    src: "conf.d/{{ item }}"
    dest: "/etc/nginx/conf.d/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  become: true
  loop: "{{ nginx_conf_d }}"
  notify: Reload nginx

- name: Deploy the site configurations
  ansible.builtin.copy:
    src: "sites/{{ item }}"
    dest: "/etc/nginx/sites-available/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  become: true
  loop: "{{ nginx_sites }}"
  notify: Reload nginx

- name: Enable the site configurations
  ansible.builtin.file:
    src: "/etc/nginx/sites-available/{{ item }}"
    dest: "/etc/nginx/sites-enabled/{{ item }}"
    state: link
    # force only bites in --check: the copy above writes nothing there, so a
    # site being added for the first time has no source to link to and the
    # module fails on a host that is otherwise perfectly fine. In a real run
    # the file has just been copied, ansible_check_mode is false, and this
    # behaves exactly as it always has.
    force: "{{ ansible_check_mode }}"
  become: true
  loop: "{{ nginx_sites }}"
  notify: Reload nginx

- name: Deploy the stream configurations
  ansible.builtin.copy:
    src: "streams/{{ item }}"
    dest: "/etc/nginx/streams-available/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  become: true
  loop: "{{ nginx_stream_sites }}"
  notify: Reload nginx

- name: Enable the stream configurations
  ansible.builtin.file:
    src: "/etc/nginx/streams-available/{{ item }}"
    dest: "/etc/nginx/streams-enabled/{{ item }}"
    state: link
  become: true
  loop: "{{ nginx_stream_sites }}"
  notify: Reload nginx

# After the plain sites above, which is where the HTTP half of a gated site --
# and with it the ACME challenge location -- gets deployed.
- name: Deploy the sites that need a TLS certificate
  ansible.builtin.include_tasks: tls_sites.yml
  when: nginx_tls_sites | length > 0

- name: Disable the stock default site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  become: true
  when:
    - nginx_disable_default_site | bool
    - "'default' not in nginx_sites"
  notify: Reload nginx

# Runs before the handlers, so a broken config fails the play instead of being
# reloaded into a live server.
- name: Validate the whole configuration
  ansible.builtin.command: nginx -t
  become: true
  changed_when: false
  check_mode: false

- name: Enable and start nginx
  ansible.builtin.systemd_service:
    name: nginx
    enabled: "{{ nginx_service_enabled | bool }}"
    state: "{{ nginx_service_state }}"
  become: true
