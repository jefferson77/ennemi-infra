# Plan B for www.ennemi.net, used by sites/ennemi-web-tls on ennemi-vps.
#
# During a show, a phone that reaches this site instead of the venue network
# lands on the connection tutorial. Plan B is for whoever still cannot get on:
# the tutorial's button sends POST /api/planb, and ennemi-web-api answers with a
# cookie naming the running spectacle instance,
#
#   ennemi_planb=<instance id>; Path=/; HttpOnly; Secure; SameSite=Lax
#
# From then on, every request carrying it is checked with the API
# (auth_request), and while it names the running instance, the audience side of
# the show app is forwarded to ennemi-brain over the tailnet. Once it does not
# -- the show stopped, another one started -- the cookie is cleared and the
# phone gets this site again. The cookie's name and Path are ennemi-web's
# (server/planb.js); they are repeated here and in the site, and must agree.
#
# In http context, so it lives in conf.d rather than in the site.

# ennemi-brain's nginx, on its tailscale IP -- the literal inventory/hosts.yml
# uses, so forwarding does not also depend on DNS resolving on this host. Plain
# HTTP: WireGuard already encrypts the traffic, and brain serves the app over
# HTTP to a request that says, with X-Forwarded-Proto, that the client used
# https (its sites/ennemi.net only redirects requests that say nothing).
upstream ennemi_brain {
    server 100.86.27.113:80;
    keepalive 16;
}

# What a Plan B phone may be forwarded to brain for: the audience page and its
# files, its socket, and the live video's WHEP offer. Anything else -- /control,
# /stage, the spectacle and asset APIs, Grafana, Prometheus, WHIP -- is not
# forwarded at all and gets this site's own answer, a 404 for all of those.
#
# Matched against the normalised $uri, which is also exactly what is forwarded
# (`rewrite ^ $uri break` in @ennemi_planb): brain never sees a raw URI that
# normalises to something this did not check. The socket is matched on its
# raw query, `domain=user` and nothing else: $arg_domain ignores case and does
# not percent-decode, while the show app's URLSearchParams does both, so
# `?DOMAIN=user&domain=control` would otherwise open a Control socket.
#
# volatile, here and below: auth_request's subrequest shares the variable
# cache with the request it checks, and re-runs the server-level `if` of the
# site. It must read 0 for /_ennemi_planb_check, not the cached 1, or the check
# itself would be forwarded to brain.
map "$request_method $uri?$args" $ennemi_planb_route {
    volatile;
    default                                       0;
    "~^(GET|HEAD) /\?"                            1;
    "~^(GET|HEAD) /(favicon\.ico|robots\.txt)\?"  1;
    "~^(GET|HEAD) /(_nuxt|images|audio)/"         1;
    "GET /api/websocket?domain=user"              1;
    "~^POST /live/[^/?]+/whep\?$"                 1;
}

# 1 for a request to forward: an instance-id-shaped cookie, on a route above.
# The character class leaves no room for a ':' smuggled in through the cookie.
map "$cookie_ennemi_planb:$ennemi_planb_route" $ennemi_planb_requested {
    volatile;
    default                                                              0;
    "~^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}:1$"  1;
}

# The socket's upgrade, passed on. Empty rather than "close" for everything
# else, so ordinary requests reuse the keepalive connections to brain.
map $http_upgrade $ennemi_planb_connection {
    default          "";
    "~*^websocket$"  upgrade;
}

# / is a different document with the cookie and without it, so a browser must
# never reuse one in place of the other: `epoch` makes it revalidate. The
# show app's own files keep brain's caching -- their names are not this site's.
map $uri $ennemi_planb_expires {
    default                     epoch;
    "~^/(_nuxt|images|audio)/"  off;
}
