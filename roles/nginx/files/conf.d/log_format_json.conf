# A JSON access log beside the default one, for Alloy and Loki (roles/alloy):
# one object per request with the timings the default format lacks, so the
# Load test dashboard can show request time and upstream time by route and
# by status. `uri` rather than `request_uri`: no query strings in the store.
# Used by `access_log ... ennemi_json` in sites/ennemi.net.
#
# In http context, so it lives in conf.d rather than in the site file.
log_format ennemi_json escape=json
    '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"host":"$host",'
        '"request_method":"$request_method",'
        '"uri":"$uri",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_connect_time":"$upstream_connect_time",'
        '"upstream_response_time":"$upstream_response_time",'
        '"http_upgrade":"$http_upgrade",'
        '"http_user_agent":"$http_user_agent"'
    '}';
