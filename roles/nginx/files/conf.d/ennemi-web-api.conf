# Rate limit for writes to the ennemi-web live-state API, used by
# `location /api/` in sites/ennemi-web-tls.
#
# The /admin/ page's password is typed by a human and can be short, so guessing
# it over the public site is slowed down here: ten writes a minute per client
# address. Reads are never limited -- every phone on the landing page polls
# GET /api/live -- which is what the map is for: an empty key is not counted.
#
# In http context, so it lives in conf.d rather than in the site file.
map $request_method $ennemi_web_api_write {
    GET     "";
    HEAD    "";
    default $binary_remote_addr;
}

limit_req_zone $ennemi_web_api_write zone=ennemi_web_api:1m rate=10r/m;
