---
# Entry point: applies every shared role to every ennemi host.
#
#   ansible-playbook playbooks/site.yml
#
# Every role is tagged with its own name so ./deploy <role> can select it.
- name: Apply the ennemi baseline
  hosts: all
  gather_facts: true
  roles:
    - role: common
      tags: [common]
    - role: docker
      tags: [docker]
    - role: tailscale
      tags: [tailscale]
    # After tailscale: it turns accept-dns off on the AdGuard host, and only
    # then is /etc/resolv.conf ours to write.
    - role: adguard
      tags: [adguard]
    - role: nginx
      tags: [nginx]
    # After nginx, and it has to be: the HTTP-01 challenge is validated by
    # fetching a file over port 80, so nginx must already be *serving*
    # /.well-known/acme-challenge/ before certbot can ask for a certificate.
    #
    # Being listed after it is necessary and not sufficient. The nginx role only
    # notifies its reload handler, which would otherwise run at the end of the
    # play -- after this role, against a server still on the old config. The
    # certbot role flushes handlers itself before validating; see the top of
    # roles/certbot/tasks/main.yml.
    #
    # The role closes the loop by re-running the one nginx step that was waiting
    # on that certificate, so a new edge comes up in a single deploy.
    - role: certbot
      tags: [certbot]

# Services that belong to some of the hosts only, each scoped to the group that
# names it. After the baseline play, which is where docker was installed.
- name: Apply the cache services
  hosts: cache
  gather_facts: true
  roles:
    - role: dragonfly
      tags: [dragonfly]

- name: Apply the database services
  hosts: database
  gather_facts: true
  roles:
    - role: postgres
      tags: [postgres]

# The development machine gets one extra role. A separate play scoped to the
# "dev" group, rather than a `when:` on the role, so the role never has to know
# which host it is running on and `./deploy dev` reads the same as the rest.
- name: Apply the development toolchain
  hosts: dev
  gather_facts: true
  roles:
    - role: dev
      tags: [dev]
